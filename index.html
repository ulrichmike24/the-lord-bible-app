    <script>
      // Silence benign browser extension noise (MetaMask, Phantom) and Vite dev WebSocket close notifications
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason || '';
        var m = (typeof r === 'string' ? r : r.message || String(r)).toLowerCase();
        var s = (r.stack || '').toLowerCase();
        if (
          m.indexOf('metamask') !== -1 ||
          m.indexOf('websocket closed') !== -1 ||
          m.indexOf('failed to connect to websocket') !== -1 ||
          s.indexOf('chrome-extension') !== -1 ||
          s.indexOf('inpage.js') !== -1 ||
          s.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1
        ) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        var m = (e.message || '').toLowerCase();
        var f = (e.filename || '').toLowerCase();
        if (
          f.indexOf('chrome-extension') !== -1 ||
          f.indexOf('inpage.js') !== -1 ||
          m.indexOf('metamask') !== -1 ||
          m.indexOf('websocket closed') !== -1
        ) {
          e.preventDefault();
        }
      });
    </script>
